{% extends 'admin_base.html' %}

{% block title %}Edit Car{% endblock %}

{% block main_content %}
<div class="container-fluid">
    <div class="row">
        <div class="offset-1 col-lg-10">
            <form class="form" action="{{ url_for('car.update_car', car_id=car.id) }}" method="POST" enctype="multipart/form-data">
                <h2 class="heading">Edit Car: {{ car.model }}</h2>
                
                <!-- Grouped fields -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="model" class="form-label">Model</label>
                            <input type="text" class="form-control" id="model" name="model" value="{{ car.model }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="brand" class="form-label">Brand</label>
                            <select class="form-control" id="brand" name="brand" required>
                                {% for brand in brands %}
                                    <option value="{{ brand.id }}" {% if car.brand.id == brand.id %}selected{% endif %}>{{ brand.brand_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="year" class="form-label">Year</label>
                            <input type="number" class="form-control" id="year" name="year" value="{{ car.year }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="price" class="form-label">Price</label>
                            <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ car.price }}" required>
                        </div>
                    </div>
                </div>

                <!-- Category Radio Buttons -->
                <div class="mb-3">
                    <label for="category_id" class="form-label">Category</label>
                    <select class="form-select" id="category_id" name="category_id" required>
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.category_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Current Images Section -->
                <div class="mb-3">
                    <label for="current_images" class="form-label">Current Images</label>
                    <div id="current_images">
                        {% for image in car.car_images %}
                            <div class="image-item">
                                <img src="{{ url_for('uploaded_file', folder='cars', filename=image.image_path) }}" alt="Car Image" class="img-thumbnail" style="width: 150px;">
                                <button type="button" class="btn btn-danger btn-sm delete-image" data-image-id="{{ image.id }}">X</button>
                            </div>
                        {% endfor %}
                    </div>
                </div>
                
                <!-- Image Upload -->
                <div class="mb-3">
                    <label for="images" class="form-label">Upload New Images</label>
                    <input type="file" class="form-control" id="images" name="images" multiple>
                </div>
                
                <!-- Additional fields: Interior Color, Exterior Color, Fuel Type, Location, VIN, Warranty -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="interior_color" class="form-label">Interior Color</label>
                            <input type="text" class="form-control" id="interior_color" name="interior_color" value="{{ car.interior_color }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="exterior_color" class="form-label">Exterior Color</label>
                            <input type="text" class="form-control" id="exterior_color" name="exterior_color" value="{{ car.exterior_color }}" required>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="fuel_type" class="form-label">Fuel Type</label>
                            <select class="form-control" id="fuel_type" name="fuel_type" required>
                                <option value="petrol" {% if car.fuel_type == 'petrol' %}selected{% endif %}>Petrol</option>
                                <option value="diesel" {% if car.fuel_type == 'diesel' %}selected{% endif %}>Diesel</option>
                                <option value="electric" {% if car.fuel_type == 'electric' %}selected{% endif %}>Electric</option>
                                <option value="hybrid" {% if car.fuel_type == 'hybrid' %}selected{% endif %}>Hybrid</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" name="location" value="{{ car.location }}" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="vin" class="form-label">VIN</label>
                            <input type="text" class="form-control" id="vin" name="vin" value="{{ car.vin }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="warranty" class="form-label">Warranty</label>
                            <input type="text" class="form-control" id="warranty" name="warranty" value="{{ car.warranty }}">
                        </div>
                    </div>
                </div>

                <!-- Other fields like condition, transmission, etc. -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="condition" class="form-label">Condition</label>
                            <div>
                                <input type="radio" id="condition_new" name="condition" value="new" {% if car.condition == 'new' %}checked{% endif %}>
                                <label for="condition_new">New</label>
                                <input type="radio" id="condition_used" name="condition" value="used" {% if car.condition == 'used' %}checked{% endif %}>
                                <label for="condition_used">Used</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="transmission" class="form-label">Transmission</label>
                            <div>
                                <input type="radio" id="trans_auto" name="transmission" value="automatic" {% if car.transmission == 'automatic' %}checked{% endif %}>
                                <label for="trans_auto">Automatic</label>
                                <input type="radio" id="trans_manual" name="transmission" value="manual" {% if car.transmission == 'manual' %}checked{% endif %}>
                                <label for="trans_manual">Manual</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3">{{ car.description }}</textarea>
                </div>

                <button type="submit" class="btn-login">Update Car</button>
            </form>
        </div>
    </div>
</div>


<script>
    // JavaScript to handle the deletion of images
    document.querySelectorAll('.delete-image').forEach(button => {
        button.addEventListener('click', (e) => {
            const imageId = e.target.getAttribute('data-image-id');
            
            // Add the image id to a hidden input field (or form data to be submitted)
            let deleteInput = document.createElement('input');
            deleteInput.type = 'hidden';
            deleteInput.name = 'delete_images';
            deleteInput.value = imageId;
            document.forms[0].appendChild(deleteInput);
            
            // Remove the image from the UI (optional)
            e.target.closest('.image-item').remove();
        });
    });
</script>

{% endblock %}
