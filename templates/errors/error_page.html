{% extends 'base.html'%}
{% block title %}  
Error page.
{% endblock %}

{% block content %}

<div class="container-fluid vh-100" style="height: 100%;">
    <div class="row">

        <div class="error_card vh-100">
        <img
            src="https://uiverse.io/astronaut.png"
            alt=""
            class="image_error"
        />
        <div class="error_heading">Error <h1 class="heading"> {{ error_code }}</h1> </div>
        <div class="icons">

            <h1 class="heading">{{ error_message }}</h1>

            <p>We apologize for the inconvenience. Please try again 
                later or contact support if the issue persists.</p>


            

        </div>
        </div>

    </div>
</div>



{% endblock %}
