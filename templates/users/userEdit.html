{% extends 'base.html' %}

{% block content %}

<div class="container-fluid d-flex align-items-center justify-content-center  mt-3">
    <div class="row align-items-center justify-content-center w-100">
        <div class="col-8">
            
            <form class="form" method="POST" action="{{ url_for('user.edit_profile', user_id=user.id) }}" enctype="multipart/form-data">
                <h2 class="mt-3 heading">Edit Profile</h2>
            
                <!-- Name Group -->
                <div class="mb-3 d-flex">
                    <div class="me-2 col-lg-4" style="flex: 1;">
                        <label for="firstname" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstname" name="firstname" value="{{ user.firstname }}" required>
                    </div>
                    <div style="flex: 1;" class="col-lg-4">
                        <label for="lastname" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastname" name="lastname" value="{{ user.lastname }}" required>
                    </div>
                    <div class="me-2 col-lg-4" style="flex: 1;">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
                    </div>
                </div>
            
                <!-- Email and Phone Number Group -->
                <div class="mb-3 d-flex">
                    <div class="col-lg-5">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                    </div>
                    <div class="mb-3 col-lg-5">
                        <label for="phone_number" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ user.phone_number }}">
                    </div>
                </div>
            
                <!-- Location and Address Group -->
                <div class="col-lg-10 d-flex">
                    <div class="mb-3 m-1 col-lg-3">
                        <label for="country" class="form-label">Country</label>
                        <input type="text" class="form-control" id="country" name="country" value="{{ user.country }}">
                    </div>
                    <div class="mb-3 m-1 col-lg-3">
                        <label for="city" class="form-label">Location</label>
                        <input type="text" class="form-control" id="city" name="city" value="{{ user.city }}" placeholder="{{ user.city }}">
                    </div>
                    <div class="mb-3 m-1 col-lg-3">
                        <label for="postal_code" class="form-label">Postal Code</label>
                        <input type="text" class="form-control" id="postal_code" name="postal_code" value="{{ user.postal_code }}">
                    </div>
                </div>
            
                <!-- Bio and Profile Picture Group -->
                    <div class="mb-3 ">
                        <label for="bio" class="form-label">Bio</label>
                        <textarea class="form-control" id="bio" name="bio" rows="4">{{ user.bio }}</textarea>
                    </div>
            
                    <div class="mb-3 ">
                        <label for="profile_picture" class="form-label">Profile Picture</label>
                        <input type="file" class="form-control" id="profile_picture" name="profile_picture">
                    </div>

                    <div class="row">
                        <div class="mb-3 col-lg-3">
                            <label for="date_of_birth" class="form-label">Date Of Birth:</label>
                            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth">
                        </div>
                
                        <!-- Gender Section -->
                        <div class="mb-3 col-lg-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" name="gender">
                                <option value="{{ user.gender.value }}"> Currently set to: {{ user.gender.value }}</option>
                                <option value="male" {% if user.gender == 'male' %}selected{% endif %}>Male</option>
                                <option value="female" {% if user.gender == 'female' %}selected{% endif %}>Female</option>
                            </select>
                        </div>

                    </div>
            

            
                <!-- Status and Roles Field (Only visible to admins) -->
                {% if session.user.role == 'admin' %}
                <div class="mb-3">
                    <label for="status" class="form-label">User Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="active" {% if user.status == 'active' %}selected{% endif %}>Active</option>
                        <option value="inactive" {% if user.status == 'inactive' %}selected{% endif %}>Inactive</option>
                    </select>
                </div>
        
                {% endif %}
            
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary mb-3">Update Profile</button>
                    <a href="{{ url_for('user.view_profile', user_id=user.id) }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
            
        </div>
    </div>
</div>

{% endblock %}
