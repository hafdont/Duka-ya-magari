{% extends 'base.html'%}
{% block title %}  
Log in
{% endblock %}

{% block content %}

<div class="container-fluid d-flex align-items-center justify-content-center login vh-100" >
    <div class="row align-items-center justify-content-center w-100" >

        <div class="form login col-lg-4 col-md-6 bg-dark rounded shadow p-4" data-aos="zoom-out-up">
 
            <form action="{{ url_for('user.login') }}" method="POST" class="text-white" id="loginForm">
                <h4 class="text-center">Log in here</h4>
                <div class="mb-3">
                    <label for="identifier" class="form-label">Email or Username</label>
                    <input type="text" class="form-control" name="identifier" placeholder="Email or Username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>

                    <p class="mt-3 heading"><a href="{{ url_for('user.reset_password_request')}}"> </a>Forgot PAssword</p>
                </div>
                <button class="btn-login" type="submit">Log in</button> 
            </form>
            <div class="text-center">
                <p class="text-white mt-3 mb-3">Don't have an account? <a href="{{ url_for('user.register') }}" class="text-info">Register here</a></p>

            </div>
        </div>
        
    </div>
</div>





{% endblock %}
