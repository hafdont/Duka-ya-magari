{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Order #{{ order.id }}</h2>

    <!-- Form to Edit Order Items -->
    <form method="POST">
        <div class="row">
            {% for item in order_items %}
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Product: </label>
                        <select class="form-control" name="product_{{ item.id }}">
                            <option value="">Select Product</option>
                            {% for product in products %}
                                <option value="{{ product.id }}" {% if product.id == item.product_id %}selected{% endif %}>{{ product.name }} - ${{ product.price }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantity: </label>
                        <input type="number" class="form-control" name="quantity_{{ item.id }}" value="{{ item.quantity }}" min="1">
                    </div>
                    <div class="form-group">
                        <label>Remove Item:</label>
                        <input type="checkbox" name="remove_items" value="{{ item.id }}">
                    </div>
                </div>
            {% endfor %}
        </div>
        
        <button type="submit" class="btn btn-primary mt-3">Update Order</button>
    </form>
</div>
{% endblock %}
