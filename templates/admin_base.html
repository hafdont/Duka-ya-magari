{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->

        <div class="`d-block d-md-none col-12 button-containerNav mt-3">


                <a href="{{ url_for('admin_bp.home') }}" >
                  <button class="Navbutton" aria-label="Home">
                    <i class="fa-duotone fa-solid fa-house" ></i>
                  </button> 
                </a>




                <a href="{{ url_for('brand_bp.brand_home') }}" >
                  <button class="Navbutton">
                    <i class="fa-sharp-duotone fa-solid fa-award" aria-label="Brands"></i>
                  </button>
                </a>



                <a href="{{ url_for('user.view_all_users') }}" >
                  <button class="Navbutton">
                    <i class="fa-duotone fa-solid fa-users" aria-label="Users"></i>
                  </button>
                </a>




                <a href="{{ url_for('car.get_cars') }}" >
                  <button class="Navbutton">
                    <i class="fa-duotone fa-solid fa-car"></i>
                  </button>
                </a>



                <a href="{{ url_for('category.list_categories') }}" >
                  <button class="NavButton">
                    <i class="fa-duotone fa-solid fa-list"></i>
                  </button>
                </a>



                
                <a href="{{ url_for('order.get_orders') }}" >
                  <button class="NavButton">
                    <i class="fa-duotone fa-solid fa-layer-group"></i>
                  </button>

                </a>





                
              <a href="{{ url_for('product.get_products') }}" >
                <button class="NavButton">
                  <i class="fa-duotone fa-solid fa-receipt"></i>
                </button>
              </a>





                  <a href="{{ url_for('blogs.get_blogs') }}">
                    <button class="NavButton">
                      <i class="fa-duotone fa-solid fa-blog"></i>
        
                    </button>
                  </a>



            </ul>
        </div>


        <div class="col-md-2 d-none d-md-flex flex-column flex-shrink-0 bg-body-tertiary d-flex flex-column flex-shrink-0 bg-body-tertiary" style="width: 4.5rem;">
            <a href="/" class="d-block p-3 link-body-emphasis text-decoration-none" title="Icon-only" data-bs-toggle="tooltip" data-bs-placement="right">
              <svg class="bi pe-none" width="40" height="32"><use xlink:href="#bootstrap"/></svg>
              <span class="visually-hidden">Icon-only</span>
            </a>
            <ul class="nav nav-pills nav-flush flex-column text-center">
              <li class="nav-item">
                <a href="{{ url_for('admin_bp.home') }}" class="nav-link py-3 border-bottom rounded-0" aria-current="page" title="Home" data-bs-toggle="tooltip" data-bs-placement="right">
                  <i class="fa-duotone fa-solid fa-house" aria-label="Home"></i>
                </a>
              </li>
              <li>
                <a href="{{ url_for('brand_bp.brand_home') }}" class="nav-link py-3 border-bottom rounded-0" title="Brands" data-bs-toggle="tooltip" data-bs-placement="right">
                  <i class="fa-sharp-duotone fa-solid fa-award" aria-label="Brands"></i>
                </a>
              </li>
              <li>
                <a href="{{ url_for('user.view_all_users') }}" class="nav-link py-3 border-bottom rounded-0" title="Users" data-bs-toggle="tooltip" data-bs-placement="right">
                  <i class="fa-duotone fa-solid fa-users" aria-label="Users"></i>
                </a>
              </li>
              <li>
                <a href="{{ url_for('car.get_cars') }}" class="nav-link py-3 border-bottom rounded-0" title="Cars" data-bs-toggle="tooltip" data-bs-placement="right">
                  <i class="fa-duotone fa-solid fa-car"></i>
                </a>
              </li>
              <li>
                <a href="{{ url_for('category.list_categories') }}" class="nav-link py-3 border-bottom rounded-0" title="Categories" data-bs-toggle="tooltip" data-bs-placement="right">
                  <i class="fa-duotone fa-solid fa-list"></i>
                </a>
              </li>
              <li>
                <a href="{{ url_for('order.get_orders') }}" class="nav-link py-3 border-bottom rounded-0" title="Orders" data-bs-toggle="tooltip" data-bs-placement="right">
                  <i class="fa-duotone fa-solid fa-layer-group"></i>
                </a>
              </li>
              <li>
                <a href="{{ url_for('product.get_products') }}" class="nav-link py-3 border-bottom rounded-0" title="Products" data-bs-toggle="tooltip" data-bs-placement="right">
                  <i class="fa-duotone fa-solid fa-receipt"></i>
                </a>
              </li>
              <li>
                <a href="{{ url_for('blogs.get_blogs') }}" class="nav-link py-3 border-bottom rounded-0" title="Blogs" data-bs-toggle="tooltip" data-bs-placement="right">
                  <i class="fa-duotone fa-solid fa-blog" style="--fa-primary-color: #3498DB; --fa-secondary-color: #3498DB;"></i>
                </a>
              </li>
            </ul>
            <div class="border-top">
              <a href="#" class="mt-1 mb-1 m-2 p-2 d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                  {% if user.profile_picture %}
                      <img src="{{ url_for('uploaded_file', folder='users', filename=user.profile_picture) }}" alt="" width="32" height="32" class="rounded-circle me-2">
                  {% else %}
                      <img src="{{ url_for('uploaded_file', folder='users', filename='defaultuser.jpg') }}" alt="Default Icon" width="32" height="32" class="rounded-circle me-2">
                  {% endif %}
              </a>
              <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                  <li><a class="dropdown-item" href="{{ url_for('user.edit_profile', user_id=user.id) }}">Update Profile</a></li>
                  <li><a class="dropdown-item" href="{{ url_for('user.view_profile', user_id=user.id) }}">View Profile</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" href="{{ url_for('user.logout') }}">Sign out</a></li>
              </ul>
            </div>
        </div>




        <!-- Main content area -->
        <div class="col-10 col-sm-10 col-md-10 d-flex justify-content-center" data-aos="fade-in">
            {% block main_content %}
            <!-- Admin-specific content goes here -->


            {% endblock %}
        </div>

    </div>
</div>







{% endblock %}
